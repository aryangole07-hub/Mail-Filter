<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail Filter</title>
<!-- Inline, so the app window gets a taskbar icon with no extra request. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233b6df6'/%3E%3Crect x='14' y='20' width='36' height='25' rx='3' fill='%23ffffff'/%3E%3Cpath d='M14 22l18 13 18-13' fill='none' stroke='%233b6df6' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#14161a; --muted:#6b7280;
  --line:#e6e8ec; --accent:#3b6df6; --accent-soft:#eaf0ff;
  --classes:#2f6df6; --fests:#c2410c; --other:#5b6472;
  --danger:#b42318; --good:#0f7b4f; --warn:#b45309;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.18);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1013; --panel:#16191e; --ink:#e8eaee; --muted:#98a1ae;
    --line:#262b33; --accent:#7aa2ff; --accent-soft:#1a2540;
    --classes:#7aa2ff; --fests:#fb923c; --other:#9aa4b2;
    --danger:#f97066; --good:#4ade80; --warn:#fbbf24;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1013; --panel:#16191e; --ink:#e8eaee; --muted:#98a1ae;
  --line:#262b33; --accent:#7aa2ff; --accent-soft:#1a2540;
  --classes:#7aa2ff; --fests:#fb923c; --other:#9aa4b2;
  --danger:#f97066; --good:#4ade80; --warn:#fbbf24;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;}
.wrap{max-width:980px;margin:0 auto;padding:26px 16px 90px;}

header{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
h1{font-size:23px;letter-spacing:-.02em;margin:0 0 3px;}
.sub{color:var(--muted);font-size:13px;margin:0;}
.spacer{flex:1 1 auto}
.iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--muted);
  width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:15px;
  transition:transform .16s ease,color .16s ease,border-color .16s ease;}
.iconbtn:hover{transform:translateY(-1px);color:var(--ink);border-color:var(--accent);}
.iconbtn:active{transform:translateY(0) scale(.96);}
.iconbtn.spin{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

nav.views{display:flex;gap:6px;margin-bottom:18px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:4px;width:fit-content;}
nav.views button{background:none;border:0;color:var(--muted);font:inherit;
  font-size:14px;font-weight:600;padding:8px 18px;border-radius:9px;cursor:pointer;
  transition:all .18s ease;}
nav.views button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);}
nav.views button:hover{color:var(--ink)}
nav.views button[aria-selected="true"]:hover{color:var(--accent)}

.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.search{flex:1 1 220px;min-width:170px;background:var(--panel);border:1px solid var(--line);
  color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;
  transition:border-color .16s ease,box-shadow .16s ease;}
.search:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);}
.tab,.chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);
  padding:7px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:12.5px;
  white-space:nowrap;transition:all .16s ease;}
.tab:hover,.chip:hover{color:var(--ink);transform:translateY(-1px);}
.tab[aria-selected="true"],.chip[aria-pressed="true"]{background:var(--accent-soft);
  border-color:var(--accent);color:var(--accent);font-weight:650;}
.tab .n{opacity:.65;margin-left:5px;font-variant-numeric:tabular-nums;}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
.chiprow .lbl{font-size:11.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin-right:4px;}

.datebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;
  padding:10px 12px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;}
.datebar select,.datebar input[type="date"]{background:var(--bg);border:1px solid var(--line);
  color:var(--ink);border-radius:8px;padding:6px 9px;font:inherit;font-size:13px;}
.datebar select:focus,.datebar input:focus{outline:none;border-color:var(--accent);}
.datebar .clear{margin-left:auto}

.sectitle{display:flex;align-items:center;gap:9px;margin:24px 0 11px;
  font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);}
.sectitle::after{content:"";flex:1;height:1px;background:var(--line);}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 17px;margin-bottom:11px;box-shadow:var(--shadow);
  animation:rise .42s cubic-bezier(.22,1,.36,1) backwards;
  transition:transform .18s ease,border-color .18s ease,opacity .28s ease;}
.card:hover{transform:translateY(-2px);
  border-color:color-mix(in srgb,var(--accent) 40%,var(--line));}
.card.leaving{opacity:0;transform:translateX(36px) scale(.97);}
.card.promoting{border-color:var(--good);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 22%,transparent);}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .card{animation:none} *{transition-duration:.01ms !important}
}

.subject{font-size:15.5px;font-weight:650;letter-spacing:-.01em;margin:0 0 5px;
  line-height:1.35;word-break:break-word;}
.meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;
  font-size:12.5px;color:var(--muted);margin-bottom:9px;}
.meta .who{font-weight:500;color:var(--ink);opacity:.8;}
.dot{opacity:.4}
.summary{font-size:14px;color:var(--ink);opacity:.9;margin:0 0 12px;word-break:break-word;}
.summary.empty{font-style:italic;opacity:.55;}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:650;
  padding:2px 8px;border-radius:999px;letter-spacing:.02em;white-space:nowrap;}
.badge.cat{background:color-mix(in srgb,currentColor 12%,transparent);}
.cat-Classes{color:var(--classes)} .cat-Fests{color:var(--fests)}
.cat-Other{color:var(--other)} .cat-Ignore{color:var(--muted)}
.badge.course{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent);}
.badge.shield{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);cursor:help;}
.badge.pinned{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);cursor:help;}
.badge.ev{background:color-mix(in srgb,var(--fests) 14%,transparent);color:var(--fests);}

.actions{display:flex;gap:8px;flex-wrap:wrap;}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);
  padding:7px 14px;border-radius:9px;cursor:pointer;font:inherit;font-size:13px;
  font-weight:550;transition:all .16s ease;}
.btn:hover{transform:translateY(-1px);border-color:var(--accent);color:var(--accent);}
.btn:active{transform:translateY(0) scale(.97);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{color:#fff;filter:brightness(1.08);}
.btn.ghost{color:var(--muted);}
.btn.ghost:hover{color:var(--danger);border-color:var(--danger);}
.btn.good:hover{color:var(--good);border-color:var(--good);}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;}

.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state .big{font-size:32px;margin-bottom:10px;}

/* calendar */
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.calhead h2{font-size:18px;margin:0;letter-spacing:-.01em;min-width:190px;}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.dow{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);text-align:center;padding:4px 0;}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  min-height:92px;padding:6px;cursor:pointer;transition:all .15s ease;
  display:flex;flex-direction:column;gap:3px;overflow:hidden;}
.day:hover{border-color:var(--accent);transform:translateY(-1px);}
.day.out{opacity:.35}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent);}
.day.sel{background:var(--accent-soft);border-color:var(--accent);}
.daynum{font-size:12px;font-weight:650;color:var(--muted);}
.day.today .daynum{color:var(--accent)}
.pill{font-size:10.5px;line-height:1.35;padding:2px 5px;border-radius:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pill.class{background:color-mix(in srgb,var(--other) 16%,transparent);color:var(--ink);opacity:.75;}
.pill.mail{background:color-mix(in srgb,var(--fests) 20%,transparent);color:var(--fests);font-weight:600;}
.pill.exam,.pill.deadline{background:color-mix(in srgb,var(--danger) 20%,transparent);
  color:var(--danger);font-weight:700;}
.more{font-size:10px;color:var(--muted);padding-left:5px;}
.daydetail{margin-top:16px}
.evrow{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;margin-bottom:8px;
  animation:rise .3s ease backwards;}
.evtime{font-variant-numeric:tabular-nums;font-weight:650;font-size:13px;min-width:52px;
  color:var(--accent);}
.evbody{flex:1;min-width:0}
.evtitle{font-weight:600;font-size:14px;margin-bottom:2px;word-break:break-word;}
.evmeta{font-size:12px;color:var(--muted);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);
  margin-top:14px;align-items:center;}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;
  margin-right:5px;vertical-align:-1px;}

/* ask - a conversation, so it reads bottom-up like one */
.chat{display:flex;flex-direction:column;gap:14px;margin-bottom:14px;padding:4px 2px 8px;
  max-height:min(58vh,560px);overflow-y:auto;overscroll-behavior:contain;}
.turn{display:flex;flex-direction:column;gap:7px;max-width:min(660px,88%);}
.turn.me{align-self:flex-end;align-items:flex-end;}
.turn.ai{align-self:flex-start;}
.chat .turn:last-child{animation:rise .3s ease backwards;}
.bub{padding:12px 15px;border-radius:16px;font-size:14.5px;line-height:1.6;
  white-space:pre-wrap;word-wrap:break-word;}
.bub.me{background:var(--accent);color:#fff;border-bottom-right-radius:5px;}
.bub.ai{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);
  border-bottom-left-radius:5px;}
.bub.ai.notfound{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));}
.turn .srctitle{margin:2px 0 4px;}
.starters{display:flex;flex-direction:column;gap:10px;padding:18px 4px;}
.starters .lead{font-size:14px;color:var(--muted);line-height:1.6;}
.starters .row{display:flex;gap:8px;flex-wrap:wrap;}
.starter{background:var(--panel);border:1px solid var(--line);color:var(--ink);
  border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;
  transition:all .15s ease;}
.starter:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);}
.askbox{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.askbox input{flex:1 1 300px;background:var(--panel);border:1px solid var(--line);
  color:var(--ink);border-radius:11px;padding:12px 14px;font:inherit;font-size:14.5px;}
.askbox input:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);}
.answer{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow);animation:rise .35s ease backwards;}
.answer.notfound{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));}
.answer p{margin:0 0 14px;font-size:15px;line-height:1.6;}
.srctitle{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px;}
.src{display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--line);
  border-radius:9px;margin-bottom:6px;cursor:pointer;transition:all .15s ease;}
.src:hover{border-color:var(--accent);transform:translateX(2px);}
.src .n{font-weight:700;color:var(--accent);font-size:12px;min-width:18px;}
.src .s{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;}
.src .d{font-size:11.5px;color:var(--muted);white-space:nowrap;}
.hint{font-size:12.5px;color:var(--muted);margin-top:12px;}
.thinking{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:14px;}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--accent);
  animation:bounce 1.1s infinite;}
.thinking i:nth-child(2){animation-delay:.15s} .thinking i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(8,10,14,.55);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;
  opacity:0;pointer-events:none;transition:opacity .22s ease;}
.overlay.open{opacity:1;pointer-events:auto;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  width:min(940px,100%);height:min(86vh,900px);display:flex;flex-direction:column;
  box-shadow:0 28px 70px -20px rgba(0,0,0,.5);overflow:hidden;
  transform:translateY(14px) scale(.985);opacity:0;
  transition:transform .26s cubic-bezier(.22,1,.36,1),opacity .2s ease;}
.overlay.open .modal{transform:none;opacity:1;}
.mhead{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);}
.mtitle{font-weight:650;font-size:14.5px;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.mframe{flex:1;border:0;width:100%;background:#fff;}
.mfoot{padding:9px 16px;border-top:1px solid var(--line);font-size:12px;
  color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:11px 15px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;
  opacity:0;pointer-events:none;transition:all .24s cubic-bezier(.22,1,.36,1);z-index:60;
  font-size:13.5px;max-width:calc(100vw - 32px);}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
.toast button{background:none;border:0;color:var(--accent);font:inherit;font-weight:650;
  cursor:pointer;padding:0;}
.hidden{display:none !important}
@media(max-width:620px){
  .day{min-height:70px} .pill{font-size:9.5px}
  .calhead h2{min-width:0;font-size:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Mail Filter</h1>
      <p class="sub" id="sub">Loading…</p>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="theme" title="Toggle light / dark">◐</button>
    <button class="iconbtn" id="refresh" title="Check Gmail for new mail">⟳</button>
  </header>

  <nav class="views">
    <button data-v="mail" aria-selected="true">Mail</button>
    <button data-v="calendar" aria-selected="false">Calendar</button>
    <button data-v="ask" aria-selected="false">Ask</button>
  </nav>

  <!-- MAIL -->
  <section id="v-mail">
    <div class="controls">
      <input class="search" id="q" type="search" placeholder="Search subject, sender or summary…" autocomplete="off">
      <button class="tab" data-f="all" aria-selected="true">All<span class="n"></span></button>
      <button class="tab" data-f="Classes" aria-selected="false">📚 Classes<span class="n"></span></button>
      <button class="tab" data-f="Fests" aria-selected="false">🎉 Fests<span class="n"></span></button>
      <button class="tab" data-f="Other" aria-selected="false">📌 Other<span class="n"></span></button>
      <button class="tab" data-f="filtered" aria-selected="false">🗃 Filtered<span class="n"></span></button>
    </div>

    <div class="chiprow" id="coursechips"><span class="lbl">Course</span></div>

    <div class="datebar">
      <select id="dmode">
        <option value="any">Any date</option>
        <option value="on">On</option>
        <option value="before">Before</option>
        <option value="after">After</option>
        <option value="between">Between</option>
      </select>
      <input type="date" id="d1" class="hidden">
      <span id="dand" class="hidden" style="color:var(--muted);font-size:13px">and</span>
      <input type="date" id="d2" class="hidden">
      <button class="btn ghost clear" id="dclear">Clear filters</button>
    </div>

    <div id="list"></div>
  </section>

  <!-- CALENDAR -->
  <section id="v-calendar" class="hidden">
    <div class="calhead">
      <button class="iconbtn" id="prev">‹</button>
      <h2 id="monthlbl"></h2>
      <button class="iconbtn" id="next">›</button>
      <button class="btn" id="today">Today</button>
    </div>
    <div class="grid" id="dow"></div>
    <div class="grid" id="calgrid" style="margin-top:6px"></div>
    <div class="legend">
      <span><i style="background:color-mix(in srgb,var(--other) 40%,transparent)"></i>Timetabled class</span>
      <span><i style="background:color-mix(in srgb,var(--fests) 55%,transparent)"></i>From your mail</span>
      <span><i style="background:color-mix(in srgb,var(--danger) 55%,transparent)"></i>Exam or deadline</span>
    </div>
    <div class="daydetail" id="daydetail"></div>
  </section>

  <!-- ASK -->
  <section id="v-ask" class="hidden">
    <div class="chat" id="chat"></div>
    <div class="askbox">
      <input id="qq" placeholder="Ask about your mail — follow-ups work too" autocomplete="off">
      <button class="btn primary" id="askbtn">Send</button>
      <button class="btn ghost" id="newchat" title="Start a new conversation">New chat</button>
    </div>
  </section>
</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-label="Original message">
    <div class="mhead">
      <div class="mtitle" id="mtitle"></div>
      <button class="btn" id="imgs">Load images</button>
      <button class="btn" id="close">Close</button>
    </div>
    <iframe class="mframe" id="mframe" sandbox referrerpolicy="no-referrer"></iframe>
    <div class="mfoot" id="mfoot"></div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastmsg"></span><button id="undo">Undo</button></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
let MAILS=[], COURSES=[], ENTRIES=[], VIEW="mail", FILTER="all", QUERY="";
let COURSEF=new Set(), DMODE="any", D1="", D2="";
let CURRENT=null, LASTACTION=null, CALMONTH=null, SELDAY=null;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function senderName(from){
  const m = String(from||"").match(/^\s*"?([^"<]*?)"?\s*<.*>\s*$/);
  return (m ? m[1].trim() : "") || String(from||"").replace(/[<>]/g,"") || "unknown";
}
function when(iso, fallback){
  if(!iso) return fallback||"";
  const d=new Date(iso); if(isNaN(d)) return fallback||"";
  const mins=Math.round((Date.now()-d)/60000);
  if(mins<1) return "just now";
  if(mins<60) return mins+"m ago";
  const h=Math.round(mins/60); if(h<24) return h+"h ago";
  const days=Math.round(h/24); if(days<7) return days+"d ago";
  return d.toLocaleDateString(undefined,{day:"numeric",month:"short"});
}
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const courseLabel = code => (COURSES.find(c=>c.code===code)||{}).label || code;

function mailDate(m){
  if(!m.received_at) return null;
  const d=new Date(m.received_at); return isNaN(d)?null:d;
}
function passesDate(m){
  if(DMODE==="any") return true;
  const d=mailDate(m); if(!d) return false;
  const s=ymd(d);
  if(DMODE==="on")     return !D1 || s===D1;
  if(DMODE==="before") return !D1 || s <  D1;
  if(DMODE==="after")  return !D1 || s >  D1;
  if(DMODE==="between"){
    if(!D1 || !D2) return true;
    const lo=D1<D2?D1:D2, hi=D1<D2?D2:D1;
    return s>=lo && s<=hi;
  }
  return true;
}

function isFiltered(m){
  return (m.category==="Ignore" || m.reported) && !m.absolute;
}
function visible(){
  const q=QUERY.trim().toLowerCase();
  return MAILS.filter(m=>{
    const f=isFiltered(m);
    if(FILTER==="filtered"){ if(!f) return false; }
    else if(FILTER==="all"){ if(f) return false; }
    else { if(f || m.category!==FILTER) return false; }
    if(COURSEF.size){
      const cs=m.courses||[];
      if(!cs.some(c=>COURSEF.has(c))) return false;
    }
    if(!passesDate(m)) return false;
    if(!q) return true;
    return (m.subject+" "+m.from+" "+m.summary+" "+m.snippet).toLowerCase().includes(q);
  });
}
function counts(){
  const c={all:0,Classes:0,Fests:0,Other:0,filtered:0};
  for(const m of MAILS){
    if(isFiltered(m)){ c.filtered++; continue; }
    c.all++; if(c[m.category]!==undefined) c[m.category]++;
  }
  return c;
}

function card(m,i){
  const el=document.createElement("article");
  el.className="card"; el.style.animationDelay=Math.min(i,12)*26+"ms"; el.dataset.id=m.id;
  const summary = m.summary
    ? `<p class="summary">${esc(m.summary)}</p>`
    : `<p class="summary empty">${esc(m.snippet||"No summary — open the original.")}</p>`;
  const courses=(m.courses||[]).map(c=>`<span class="badge course">${esc(courseLabel(c))}</span>`).join("");
  const shield = m.marked_important
    ? `<span class="badge pinned" title="You marked this important. It can never be hidden again.">important</span>`
    : m.absolute
    ? `<span class="badge shield" title="${esc(m.rescue_reason||"Always shown")}">shielded</span>`
    : m.rescued
    ? `<span class="badge shield" title="Kept visible because ${esc(m.rescue_reason)}">shielded</span>` : "";
  const evs=(m.events||[]).length
    ? `<span class="badge ev">${m.events.length} date${m.events.length>1?"s":""}</span>` : "";
  // One action per card, and it is the one that makes sense for where the
  // card is. Mail that is being shown can be pushed down; mail that is hidden
  // can be pulled up. Offering both on every card asked you to work out which
  // of two similar-sounding buttons applied to what you were looking at.
  const filtered = isFiltered(m);
  const reportDisabled = m.absolute && !m.marked_important;
  const action = filtered
    ? `<button class="btn good" data-a="imp">Mark important</button>`
    : m.marked_important
    ? `<button class="btn good" data-a="imp">Unmark important</button>`
    : `<button class="btn ghost" data-a="rep"${reportDisabled?' disabled title="This can never be hidden"':""}>Mark unimportant</button>`;
  el.innerHTML=`
    <h2 class="subject">${esc(m.subject)}</h2>
    <div class="meta">
      <span class="badge cat cat-${esc(m.category)}">${esc(m.category)}</span>
      ${courses}
      <span class="who">${esc(senderName(m.from))}</span>
      <span class="dot">·</span><span>${esc(when(m.received_at,m.date))}</span>
      ${shield}${evs}
    </div>
    ${summary}
    <div class="actions">
      <button class="btn primary" data-a="open">Original</button>
      ${action}
    </div>`;
  el.querySelector('[data-a="open"]').onclick=()=>openOriginal(m);
  const imp=el.querySelector('[data-a="imp"]');
  if(imp) imp.onclick=e=>act(m,el,e.currentTarget,"important");
  const rep=el.querySelector('[data-a="rep"]');
  if(rep && !reportDisabled) rep.onclick=e=>act(m,el,e.currentTarget,"report");
  return el;
}

function renderMail(){
  const list=$("#list"); list.innerHTML="";
  const rows=visible(), c=counts();
  $$(".tab").forEach(t=>{
    t.setAttribute("aria-selected",String(t.dataset.f===FILTER));
    t.querySelector(".n").textContent=c[t.dataset.f]??0;
  });
  if(!rows.length){
    list.innerHTML=`<div class="empty-state"><div class="big">✦</div><div>${
      QUERY||COURSEF.size||DMODE!=="any" ? "Nothing matches those filters."
      : FILTER==="filtered" ? "Nothing has been filtered out."
      : "No mail yet. Run mail_filter.py."}</div></div>`;
    return;
  }
  if(FILTER==="all" && !COURSEF.size && DMODE==="any"){
    let i=0;
    for(const cat of ["Classes","Fests","Other"]){
      const g=rows.filter(m=>m.category===cat);
      if(!g.length) continue;
      const h=document.createElement("div"); h.className="sectitle";
      h.textContent=`${cat} · ${g.length}`; list.appendChild(h);
      for(const m of g) list.appendChild(card(m,i++));
    }
  } else rows.forEach((m,i)=>list.appendChild(card(m,i)));
}

function renderChips(){
  const box=$("#coursechips");
  box.querySelectorAll(".chip").forEach(n=>n.remove());
  for(const c of COURSES){
    const b=document.createElement("button");
    b.className="chip"; b.textContent=c.label;
    b.title=c.code+" — "+c.name+(c.profs.length?" · "+c.profs.join(", "):"");
    b.setAttribute("aria-pressed",String(COURSEF.has(c.code)));
    b.onclick=()=>{ COURSEF.has(c.code)?COURSEF.delete(c.code):COURSEF.add(c.code);
      b.setAttribute("aria-pressed",String(COURSEF.has(c.code))); renderMail(); };
    box.appendChild(b);
  }
}

/* ---- calendar ---- */
function renderCal(){
  const base=CALMONTH||new Date();
  CALMONTH=new Date(base.getFullYear(),base.getMonth(),1);
  $("#monthlbl").textContent=CALMONTH.toLocaleDateString(undefined,{month:"long",year:"numeric"});
  const dow=$("#dow"); dow.innerHTML="";
  for(const d of ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"]){
    const e=document.createElement("div"); e.className="dow"; e.textContent=d; dow.appendChild(e);
  }
  const first=new Date(CALMONTH), offset=(first.getDay()+6)%7;
  const start=new Date(first); start.setDate(1-offset);
  const grid=$("#calgrid"); grid.innerHTML="";
  const todayS=ymd(new Date());
  const byDay={};
  for(const e of ENTRIES){ (byDay[e.date]=byDay[e.date]||[]).push(e); }

  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const s=ymd(d);
    const cell=document.createElement("div");
    cell.className="day"+(d.getMonth()!==CALMONTH.getMonth()?" out":"")
      +(s===todayS?" today":"")+(s===SELDAY?" sel":"");
    cell.innerHTML=`<div class="daynum">${d.getDate()}</div>`;
    const list=(byDay[s]||[]);
    const mails=list.filter(e=>e.source==="mail");
    const classes=list.filter(e=>e.source==="timetable");
    for(const e of mails.slice(0,3)){
      const p=document.createElement("div");
      p.className="pill "+(["exam","deadline"].includes(e.kind)?e.kind:"mail");
      p.textContent=(e.start_time?e.start_time+" ":"")+e.title;
      p.title=e.title; cell.appendChild(p);
    }
    if(classes.length && mails.length<3){
      const p=document.createElement("div"); p.className="pill class";
      p.textContent=classes.length+" class"+(classes.length>1?"es":"");
      cell.appendChild(p);
    }
    const extra=list.length-Math.min(mails.length,3)-(classes.length?1:0);
    if(extra>0){ const e2=document.createElement("div"); e2.className="more";
      e2.textContent="+"+extra+" more"; cell.appendChild(e2); }
    cell.onclick=()=>{ SELDAY=s; renderCal(); };
    grid.appendChild(cell);
  }
  renderDay();
}
function renderDay(){
  const box=$("#daydetail");
  if(!SELDAY){ box.innerHTML=`<p class="hint">Pick a day to see everything on it.</p>`; return; }
  const list=ENTRIES.filter(e=>e.date===SELDAY);
  const d=new Date(SELDAY+"T00:00:00");
  let html=`<div class="sectitle">${d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})} · ${list.length}</div>`;
  if(!list.length) html+=`<p class="hint">Nothing scheduled.</p>`;
  for(const e of list){
    const meta=[e.location,(e.profs||[]).join(", "),e.section,
      e.source==="mail"?"from mail":""].filter(Boolean).join(" · ");
    html+=`<div class="evrow">
      <div class="evtime">${esc(e.start_time||"—")}</div>
      <div class="evbody">
        <div class="evtitle">${esc(e.title)}</div>
        <div class="evmeta">${esc(meta)}</div>
      </div>
      ${e.mail_id?`<button class="btn" data-open="${esc(e.mail_id)}">Mail</button>`:""}
    </div>`;
  }
  box.innerHTML=html;
  box.querySelectorAll("[data-open]").forEach(b=>{
    b.onclick=()=>{ const m=MAILS.find(x=>x.id===b.dataset.open); if(m) openOriginal(m); };
  });
}

/* ---- ask: a conversation with the local model ----
   CHAT is the transcript. Only {role,content} is sent to the server - the
   sources hanging off a turn are for the page, and the model has already
   been told what it may say about them. */
let CHAT=[];
const STARTERS=["What's due this week?","Any exam or quiz dates coming up?",
                "What did I get from the placement office?"];

try{ const saved=sessionStorage.getItem("mf-chat"); if(saved) CHAT=JSON.parse(saved)||[]; }catch(e){}
function saveChat(){
  try{ sessionStorage.setItem("mf-chat",JSON.stringify(CHAT.slice(-24))); }catch(e){}
}

/* The model writes light markdown. Escape first, then allow exactly two
   things back in: bold, and a bullet marker. Nothing here can introduce a
   tag, because every angle bracket was already escaped. */
function fmtChat(text){
  return esc(text||"")
    .replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>")
    .replace(/^\s*[*-]\s+/gm,"• ");
}

function srcRows(sources){
  return (sources||[]).map((s,i)=>`
    <div class="src" data-open="${esc(s.id)}">
      <span class="n">${i+1}</span>
      <span class="s">${esc(s.subject)}</span>
      <span class="d">${esc(when(s.received_at,s.date))}</span>
    </div>`).join("");
}

function renderChat(){
  const box=$("#chat");
  if(!CHAT.length){
    box.innerHTML=`<div class="starters">
      <div class="lead">Ask me anything about the mail in here. I answer only from
        your own inbox, and every claim comes with the email it came from.</div>
      <div class="row">${STARTERS.map(s=>`<button class="starter">${esc(s)}</button>`).join("")}</div>
    </div>`;
    box.querySelectorAll(".starter").forEach(b=>{
      b.onclick=()=>{ $("#qq").value=b.textContent; doAsk(); };
    });
    return;
  }
  box.innerHTML=CHAT.map(t=>{
    if(t.role==="user"){
      return `<div class="turn me"><div class="bub me">${esc(t.content)}</div></div>`;
    }
    if(t.pending){
      return `<div class="turn ai"><div class="bub ai"><div class="thinking"><i></i><i></i><i></i> Reading your mail…</div></div></div>`;
    }
    const rows=srcRows(t.sources);
    return `<div class="turn ai">
      <div class="bub ai${t.found?"":" notfound"}">${fmtChat(t.content||"No answer.")}</div>
      ${rows
        ? `<div class="srctitle">From these emails</div>${rows}`
        : `<div class="hint">Nothing here was traced to an email.</div>`}
    </div>`;
  }).join("");
  box.querySelectorAll("[data-open]").forEach(b=>{
    b.onclick=()=>{ const m=MAILS.find(x=>x.id===b.dataset.open); if(m) openOriginal(m); };
  });
  box.scrollTop=box.scrollHeight;
}

async function doAsk(){
  const q=$("#qq").value.trim(); if(!q) return;
  if($("#askbtn").disabled) return;
  $("#qq").value="";
  CHAT.push({role:"user",content:q});
  CHAT.push({role:"assistant",content:"",pending:true});
  renderChat();
  $("#askbtn").disabled=true;
  try{
    const history=CHAT.filter(t=>!t.pending).map(t=>({role:t.role,content:t.content}));
    const r=await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages:history})});
    const d=await r.json();
    CHAT[CHAT.length-1]={role:"assistant",content:d.answer||"No answer.",
                         sources:d.sources||[],found:!!d.found};
  }catch(err){
    CHAT[CHAT.length-1]={role:"assistant",content:"Could not ask: "+err.message,
                         sources:[],found:false};
  }
  $("#askbtn").disabled=false;
  saveChat();
  renderChat();
  $("#qq").focus();
}

function newChat(){
  CHAT=[];
  try{ sessionStorage.removeItem("mf-chat"); }catch(e){}
  renderChat();
  $("#qq").focus();
}

/* ---- original ---- */
function openOriginal(m,withImages){
  CURRENT=m;
  $("#mtitle").textContent=m.subject;
  $("#mframe").src=`/original/${encodeURIComponent(m.id)}?images=${withImages?1:0}`;
  $("#imgs").textContent=withImages?"Images shown":"Load images";
  $("#imgs").disabled=!!withImages;
  $("#mfoot").textContent=withImages
    ? "Shown exactly as received, with remote images loaded."
    : "Shown exactly as received. Remote images are blocked — many are tracking pixels that tell the sender when you opened the mail.";
  $("#overlay").classList.add("open");
  document.body.style.overflow="hidden";
}
function closeModal(){
  $("#overlay").classList.remove("open");
  document.body.style.overflow="";
  setTimeout(()=>{ $("#mframe").src="about:blank"; },240);
}

/* ---- mark unimportant / important ----
   The endpoint is still /api/report: the stored feedback keeps that name, and
   renaming it would rewrite everyone's feedback.json for a label change. */
async function act(m,el,btn,kind){
  const undo = kind==="important" ? !!m.marked_important : !!m.reported;
  btn.disabled=true;
  try{
    const r=await fetch(kind==="important"?"/api/important":"/api/report",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id:m.id,undo})});
    if(!r.ok) throw new Error(await r.text());
    if(kind==="important"){
      m.marked_important=!undo;
      if(!undo){ m.reported=false; m.absolute=true; el.classList.add("promoting"); }
      LASTACTION={m,kind};
      setTimeout(()=>{load();},420);
      showToast(undo?"No longer pinned as important."
        :"Marked important. This sender will never be hidden again.");
    }else{
      m.reported=!undo;
      if(!undo){ el.classList.add("leaving"); setTimeout(renderMail,280); }
      else renderMail();
      LASTACTION={m,kind};
      showToast(undo?"No longer marked unimportant."
        :"Marked unimportant. It moves to Filtered, and the classifier learns from this.");
    }
  }catch(err){
    showToast("Could not save that: "+err.message,false);
    btn.disabled=false;
  }
}
let toastTimer=null;
function showToast(msg,undoable=true){
  $("#toastmsg").textContent=msg;
  $("#undo").style.display=undoable?"":"none";
  $("#toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>$("#toast").classList.remove("show"),6000);
}
$("#undo").onclick=async()=>{
  if(!LASTACTION) return;
  const {m,kind}=LASTACTION;
  await fetch(kind==="important"?"/api/important":"/api/report",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id:m.id,undo:true})});
  LASTACTION=null; $("#toast").classList.remove("show"); load();
};

/* ---- wiring ---- */
$$("nav.views button").forEach(b=>{
  b.onclick=()=>{
    VIEW=b.dataset.v;
    $$("nav.views button").forEach(x=>x.setAttribute("aria-selected",String(x===b)));
    $("#v-mail").classList.toggle("hidden",VIEW!=="mail");
    $("#v-calendar").classList.toggle("hidden",VIEW!=="calendar");
    $("#v-ask").classList.toggle("hidden",VIEW!=="ask");
    if(VIEW==="calendar"){ loadCalendar(); }
    if(VIEW==="ask"){ $("#qq").focus(); }
  };
});
$$(".tab").forEach(t=>{ t.onclick=()=>{ FILTER=t.dataset.f; renderMail(); }; });
$("#q").oninput=e=>{ QUERY=e.target.value; renderMail(); };
$("#dmode").onchange=e=>{
  DMODE=e.target.value;
  const needs1=DMODE!=="any", needs2=DMODE==="between";
  $("#d1").classList.toggle("hidden",!needs1);
  $("#d2").classList.toggle("hidden",!needs2);
  $("#dand").classList.toggle("hidden",!needs2);
  renderMail();
};
$("#d1").onchange=e=>{ D1=e.target.value; renderMail(); };
$("#d2").onchange=e=>{ D2=e.target.value; renderMail(); };
$("#dclear").onclick=()=>{
  QUERY=""; $("#q").value=""; COURSEF.clear(); DMODE="any"; D1=""; D2="";
  $("#dmode").value="any"; $("#d1").value=""; $("#d2").value="";
  $("#d1").classList.add("hidden"); $("#d2").classList.add("hidden"); $("#dand").classList.add("hidden");
  renderChips(); renderMail();
};
$("#close").onclick=closeModal;
$("#imgs").onclick=()=>CURRENT&&openOriginal(CURRENT,true);
$("#overlay").onclick=e=>{ if(e.target===$("#overlay")) closeModal(); };
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeModal();
  if(e.key==="/" && document.activeElement.tagName!=="INPUT"){ e.preventDefault(); $("#q").focus(); }
});
$("#askbtn").onclick=doAsk;
$("#newchat").onclick=newChat;
$("#qq").addEventListener("keydown",e=>{ if(e.key==="Enter") doAsk(); });
renderChat();
$("#prev").onclick=()=>{ CALMONTH.setMonth(CALMONTH.getMonth()-1); loadCalendar(); };
$("#next").onclick=()=>{ CALMONTH.setMonth(CALMONTH.getMonth()+1); loadCalendar(); };
$("#today").onclick=()=>{ CALMONTH=new Date(); SELDAY=ymd(new Date()); loadCalendar(); };
$("#refresh").onclick=refreshNow;

/* Refresh means "go and check Gmail", not "re-read the file". The check runs
   on the server and can take a while, so the button spins until it reports
   back. */
let FETCHING=false;
async function refreshNow(){
  if(FETCHING) return;
  FETCHING=true;
  $("#refresh").classList.add("spin");
  try{
    const s=await (await fetch("/api/fetch",{method:"POST"})).json();
    showToast(s.message||"Checking Gmail for new mail…",false);
    await pollFetch();
  }catch(err){
    showToast("Could not check for new mail: "+err.message,false);
    FETCHING=false; $("#refresh").classList.remove("spin");
  }
}

async function pollFetch(){
  let state=null;
  while(true){
    await new Promise(r=>setTimeout(r,1500));
    try{
      state=await (await fetch("/api/fetch")).json();
    }catch(err){
      break;   // server went away; stop spinning rather than hang forever
    }
    if(!state.running) break;
  }
  FETCHING=false;
  $("#refresh").classList.remove("spin");
  await load(true);
  if(VIEW==="calendar") loadCalendar();
  if(state) showToast(state.message||"Done.",false);
}
$("#theme").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const next=cur==="dark"?"light":cur==="light"?"dark"
    :(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark");
  document.documentElement.setAttribute("data-theme",next);
  try{ localStorage.setItem("mf-theme",next); }catch(e){}
};
try{ const s=localStorage.getItem("mf-theme"); if(s) document.documentElement.setAttribute("data-theme",s); }catch(e){}

async function loadCalendar(){
  const base=CALMONTH||new Date();
  const from=new Date(base.getFullYear(),base.getMonth()-1,1);
  const to=new Date(base.getFullYear(),base.getMonth()+2,0);
  try{
    const r=await fetch(`/api/calendar?from=${ymd(from)}&to=${ymd(to)}`);
    ENTRIES=(await r.json()).entries||[];
  }catch(e){ ENTRIES=[]; }
  renderCal();
}

async function load(silent){
  if(!silent){ $("#refresh").classList.add("spin"); }
  try{
    const [mr,cr]=await Promise.all([fetch("/api/mails"),fetch("/api/courses")]);
    const data=await mr.json();
    COURSES=(await cr.json()).courses||[];
    MAILS=data.mails||[];
    const shown=MAILS.filter(m=>!isFiltered(m)).length;
    $("#sub").textContent=`${shown} mail${shown===1?"":"s"} worth your attention`
      +(data.generated_at?` · updated ${when(data.generated_at)}`:"");
    renderChips(); renderMail();
  }catch(err){
    $("#sub").textContent="Could not read the digest: "+err.message;
  }
  // Only the click that started it clears the spin: a background reload must
  // not stop the wheel while a Gmail check is still running.
  if(!silent){ $("#refresh").classList.remove("spin"); }
}

// Keep it close to live without hammering the disk: a quiet poll while the
// page is visible and no message is open.
setInterval(()=>{
  if(document.hidden) return;
  if($("#overlay").classList.contains("open")) return;
  load(true);
  if(VIEW==="calendar") loadCalendar();
}, 30000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) load(true); });

CALMONTH=new Date(); SELDAY=ymd(new Date());
load();

// A check started before this page was opened (or before it was reloaded) is
// still running on the server - pick the spinner back up rather than looking
// idle while mail is on its way in.
fetch("/api/fetch").then(r=>r.json()).then(s=>{
  if(s && s.running && !FETCHING){
    FETCHING=true;
    $("#refresh").classList.add("spin");
    pollFetch();
  }
}).catch(()=>{});
</script>
</body>
</html>
